name: Verify and publish read-only runtime inspector
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime_profile:
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test actual Windows module enumeration and report fields
        shell: powershell
        run: ./tools/runtime-profile/Collect-Runtime.ps1 -SelfTest
      - name: Package inspector
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib, os
          root=Path('tools/runtime-profile')
          out=Path(os.environ['RUNNER_TEMP'])/'Sora-WW-Runtime-Inspector-v1.zip'
          with ZipFile(out,'w',ZIP_DEFLATED) as z:
            for name in ['Collect-Runtime.ps1','Inspect-Runtime.cmd','README.vi.txt']:
              z.write(root/name,name)
          with ZipFile(out) as z:
            assert z.testzip() is None and len(z.namelist())==3
          Path(str(out)+'.sha256').write_text(hashlib.sha256(out.read_bytes()).hexdigest()+'  '+out.name+'\n')
      - name: Publish tested helper
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.2.0-ui-preview "$RUNNER_TEMP/Sora-WW-Runtime-Inspector-v1.zip" "$RUNNER_TEMP/Sora-WW-Runtime-Inspector-v1.zip.sha256" --repo "$GITHUB_REPOSITORY"
