name: Build and verify Windows foundation
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.14.1'
      - name: Build Windows x64 and check PE imports
        run: python scripts/build.py --zig zig
      - name: Verify native UI, shortcuts and the actual EXE lifecycle
        run: python scripts/verify_windows.py --zig zig
      - name: Package verified binary and source
        run: python scripts/package.py
      - name: Export test-app UI previews for review
        if: github.ref == 'refs/heads/feature/reference-ui'
        shell: python
        run: |
          from pathlib import Path
          import base64
          for path in sorted(Path('dist').glob('ui-preview-*.png')):
            encoded=base64.b64encode(path.read_bytes()).decode('ascii')
            parts=[encoded[i:i+3000] for i in range(0,len(encoded),3000)]
            for index,part in enumerate(parts):
              print(f'SORA_UI_PREVIEW|{path.name}|{index}|{len(parts)}|{part}',flush=True)
      - name: Upload tested packages
        uses: actions/upload-artifact@v4
        with:
          name: WuWa-PC-verified-packages
          path: |
            dist/*.zip
            dist/*.sha256
            dist/windows-verification.json
            dist/ui-preview-*.png
      - name: Publish foundation preview
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/game-launcher'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python -c "import json;print(json.load(open('dist/build.json'))['version'])")"
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            target="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
            if [ "$target" = "$GITHUB_SHA" ]; then exit 0; fi
            echo 'This version already exists for another commit. Bump the version before publishing.'
            exit 1
          fi
          cat > "$RUNNER_TEMP/wuwa-release.md" <<'NOTES'
          Sửa lệnh Mở game để truyền tham số -krqlv=sd do chủ tool cung cấp cho bản SD. EXE và tham số được truyền riêng qua Windows ShellExecuteEx; không cần sửa tên file hay tạo shortcut. Giữ đường dẫn, phím menu và thiết lập đã lưu.

          Thoát bản cũ bằng Thoát, giải nén toàn bộ ZIP win64, chạy Start-WuWa-PC.cmd và mở menu bằng phím đã lưu. Bấm Mở game trong Tổng quan. Nếu chưa chọn đường dẫn, chọn Client/Binaries/Win64/Client-Win64-Shipping.exe.

          Windows CI khởi chạy EXE mô phỏng chỉ tạo cửa sổ khi nhận đúng -krqlv=sd và đúng thư mục làm việc; đồng thời kiểm tra đường dẫn Unicode, chống mở trùng, chờ cửa sổ và tự ẩn menu. Chưa xác nhận việc vào WuWa thật; ba chức năng gameplay vẫn chưa triển khai.
          NOTES
          gh release create "$tag" dist/*.zip dist/*.sha256 dist/ui-preview-*.png --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Sora WW $version - Game launcher preview" --notes-file "$RUNNER_TEMP/wuwa-release.md" --prerelease --latest=false
