name: Build and verify Windows foundation
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.14.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install file preparer build dependencies
        run: python -m pip install -r tools/gameplay-prototype/requirements.txt pyinstaller==6.16.0
      - name: Build Windows x64 and check PE imports
        run: python scripts/build.py --zig zig
      - name: Build and verify frozen file preparer
        run: python scripts/build_backend.py
      - name: Verify native UI, shortcuts and the actual EXE lifecycle
        run: python scripts/verify_windows.py --zig zig
      - name: Package verified binary and source
        run: python scripts/package.py
      - name: Export test-app UI previews for review
        if: github.ref == 'refs/heads/feature/reference-ui'
        shell: python
        run: |
          from pathlib import Path
          import base64
          for path in sorted(Path('dist').glob('ui-preview-*.png')):
            encoded=base64.b64encode(path.read_bytes()).decode('ascii')
            parts=[encoded[i:i+3000] for i in range(0,len(encoded),3000)]
            for index,part in enumerate(parts):
              print(f'SORA_UI_PREVIEW|{path.name}|{index}|{len(parts)}|{part}',flush=True)
      - name: Upload tested packages
        uses: actions/upload-artifact@v4
        with:
          name: WuWa-PC-verified-packages
          path: |
            dist/*.zip
            dist/*.sha256
            dist/windows-verification.json
            dist/ui-preview-*.png
      - name: Publish foundation preview
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/gameplay-trial'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python -c "import json;print(json.load(open('dist/build.json'))['version'])")"
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            target="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
            if [ "$target" = "$GITHUB_SHA" ]; then exit 0; fi
            echo 'This version already exists for another commit. Bump the version before publishing.'
            exit 1
          fi
          cat > "$RUNNER_TEMP/wuwa-release.md" <<'NOTES'
          Bản khôi phục sau báo cáo game đóng khi dùng gói thử 0.4. Hai lựa chọn cũ bị tạm dừng và không được bật lại từ cấu hình đã lưu. Nút Khôi phục / Mở game gỡ gói thử có hash khớp hồ sơ tool rồi mới mở EXE gốc với -krqlv=sd. Không tạo gói mới, không sửa PAK/SIG/EXE gốc.

          Đóng game, Thoát hẳn bản tool 0.4, giải nén toàn bộ ZIP mới (giữ cả hai EXE), mở menu và bấm Khôi phục / Mở game. Nếu không chứng minh được gói là của tool hoặc file đã thay đổi, tool giữ nguyên và báo lỗi thay vì tự xóa.

          Windows CI kiểm tra đặt lại cấu hình cũ, nút tạm dừng, chặn chuẩn bị gói mới, luồng menu → backend gỡ gói → mở EXE mô phỏng, cùng các kiểm tra phím/đường dẫn/giao diện. Chưa có xác nhận khôi phục trên máy người dùng; nguyên nhân cụ thể của lần văng và backend gameplay thời gian thực vẫn chưa xác minh.
          NOTES
          gh release create "$tag" dist/*.zip dist/*.sha256 dist/ui-preview-*.png --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Sora WW $version - Recovery from 0.4 trial" --notes-file "$RUNNER_TEMP/wuwa-release.md" --prerelease --latest=false
