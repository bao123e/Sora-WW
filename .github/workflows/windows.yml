name: Verify read-only gameplay assembly reader
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gameplay_reader:
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test managed PE carving and integrity rejection
        shell: powershell
        run: ./tools/gameplay-reader/Read-Gameplay.ps1 -SelfTest
      - name: Package scripts only
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import os,hashlib
          root=Path('tools/gameplay-reader');out=Path(os.environ['RUNNER_TEMP'])/'Sora-WW-Gameplay-Reader-v2.zip'
          script=(root/'GameplayReader.cs').read_text()
          assert 'AssemblyName.GetAssemblyName' in script and 'sha.ComputeHash' in script
          for forbidden in ['ReadProcessMemory','WriteProcessMemory','CreateRemoteThread','Assembly.Load','Invoke-WebRequest']:
            assert forbidden not in script
          with ZipFile(out,'w',ZIP_DEFLATED) as z:
            for name in ['GameplayReader.cs','Read-Gameplay.ps1','Read-Gameplay.cmd','README.vi.txt']:z.write(root/name,name)
          with ZipFile(out) as z:assert z.testzip() is None and len(z.namelist())==4
          Path(str(out)+'.sha256').write_text(hashlib.sha256(out.read_bytes()).hexdigest()+'  '+out.name+'\n')
      - name: Publish tested reader
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.3.1-launcher-preview "$RUNNER_TEMP/Sora-WW-Gameplay-Reader-v2.zip" "$RUNNER_TEMP/Sora-WW-Gameplay-Reader-v2.zip.sha256" --repo "$GITHUB_REPOSITORY"
