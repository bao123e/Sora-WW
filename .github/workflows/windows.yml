name: Build and verify Windows foundation
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.14.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install file preparer build dependencies
        run: python -m pip install -r tools/gameplay-prototype/requirements.txt pyinstaller==6.16.0
      - name: Build Windows x64 and check PE imports
        run: python scripts/build.py --zig zig
      - name: Build and verify frozen file preparer
        run: python scripts/build_backend.py
      - name: Verify native UI, shortcuts and the actual EXE lifecycle
        run: python scripts/verify_windows.py --zig zig
      - name: Package verified binary and source
        run: python scripts/package.py
      - name: Export test-app UI previews for review
        if: github.ref == 'refs/heads/feature/reference-ui'
        shell: python
        run: |
          from pathlib import Path
          import base64
          for path in sorted(Path('dist').glob('ui-preview-*.png')):
            encoded=base64.b64encode(path.read_bytes()).decode('ascii')
            parts=[encoded[i:i+3000] for i in range(0,len(encoded),3000)]
            for index,part in enumerate(parts):
              print(f'SORA_UI_PREVIEW|{path.name}|{index}|{len(parts)}|{part}',flush=True)
      - name: Upload tested packages
        uses: actions/upload-artifact@v4
        with:
          name: WuWa-PC-verified-packages
          path: |
            dist/*.zip
            dist/*.sha256
            dist/windows-verification.json
            dist/ui-preview-*.png
      - name: Publish foundation preview
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/gameplay-trial'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python -c "import json;print(json.load(open('dist/build.json'))['version'])")"
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            target="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
            if [ "$target" = "$GITHUB_SHA" ]; then exit 0; fi
            echo 'This version already exists for another commit. Bump the version before publishing.'
            exit 1
          fi
          cat > "$RUNNER_TEMP/wuwa-release.md" <<'NOTES'
          Bản thử 0.4 tích hợp chuẩn bị gói C# ngoại tuyến cho No Cooldown và chặn hai luồng sát thương cục bộ, chỉ cho role thuộc người chơi. Các lựa chọn được lưu và áp dụng ở lần mở game sau. Damage Multiplier chưa hỗ trợ. Hiệu lực gameplay trong WuWa thật chưa được xác nhận.

          Giải nén TOÀN BỘ ZIP, gồm WuWa-PC.exe và Sora-Gameplay.exe. Đóng game trước khi thay gói. Trong Tổng quan, bật lựa chọn thử rồi bấm Mở game. Backend đối chiếu đúng pakchunk18 đã phân tích và tạo riêng zz_SoraWW_Experimental_P.pak. Không thay PAK/SIG/EXE gốc, không sửa kiểm tra chữ ký hoặc tiêm tiến trình. Hoàn tác gói thử chỉ xóa gói do tool tạo có hash còn khớp. Tool dừng nếu game đang chạy, bản game khác hoặc gói thử đã bị thay đổi.

          CI kiểm tra control/phím, chọn đường dẫn, backend Windows đóng gói độc lập, gói PAK đọc lại, hash, hoàn tác và từ chối đầu vào sai. Kiểm tra với đầu vào thật đã chạy ngoại tuyến riêng; chưa chạy game thật. Đây là bản thử có thể không được client nạp; không suy ra hiệu lực từ trạng thái tìm thấy cửa sổ hoặc chuẩn bị gói thành công.
          NOTES
          gh release create "$tag" dist/*.zip dist/*.sha256 dist/ui-preview-*.png --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Sora WW $version - Experimental gameplay trial" --notes-file "$RUNNER_TEMP/wuwa-release.md" --prerelease --latest=false
